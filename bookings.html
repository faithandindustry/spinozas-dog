<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings — Spinozas Dog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap');
        body {
            font-family: 'Geist', system-ui, sans-serif;
            font-weight: 400;
        }
     
        .hero-bg {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            transition: background-image 2s ease-in-out;
        }
     
        .title {
            font-size: 3.2rem;
            letter-spacing: -0.04em;
        }
        .nav-link {
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .nav-link:hover { color: #ccc; }

        .photo-credit {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            z-index: 100;
            text-align: right;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* ============== MOBILE RESPONSIVENESS ============== */
        @media (max-width: 768px) {
            .title { 
                font-size: 2.35rem; 
            }
            .nav-link { 
                font-size: 1rem; 
            }
            .max-w-md {
                max-width: 100% !important;
            }
            .px-8, .md\\:px-12 {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }
            .text-5xl {
                font-size: 2.8rem;
            }
            .text-2xl, .text-xl {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="bg-black text-white">

    <!-- Background Slideshow -->
    <div id="slideshow" class="hero-bg fixed inset-0 z-0"></div>

    <!-- Top Bar - Mobile Friendly -->
    <div class="relative z-50 px-6 md:px-12 py-6 md:py-8">
        <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-6 md:gap-0">
            <a href="index.html" class="title tracking-tighter text-center md:text-left">Spinozas Dog</a>
           
            <div class="flex flex-wrap justify-center gap-x-5 md:gap-x-8">
                <a href="index.html" class="nav-link">About</a>
                <a href="performances.html" class="nav-link">Performances</a>
                <a href="recordings.html" class="nav-link">Recordings</a>
                <a href="bookings.html" class="nav-link">Bookings</a>
                <a href="contact.html" class="nav-link">Network</a>
            </div>
        </div>
    </div>

    <div class="relative z-10 flex items-center justify-center min-h-[calc(100vh-120px)] px-6">
        <div class="max-w-md text-center">
            <h1 class="text-5xl tracking-tighter mb-12">Bookings</h1>
            <p class="text-xl leading-relaxed text-white/80 mb-10">
                Guitar / Drums / Bass
<br>
                Your space
<br>
                We are accepting bookings for 2026 and 2027.
            </p>
            <a href="mailto:faithandindustry@protonmail.com"
               class="block text-2xl border border-white/30 hover:border-white py-6 rounded-3xl transition">
                Contact
            </a>
        </div>
    </div>
   
    <!-- Photo Credit -->
    <div class="photo-credit">
        Photography by Mich J Tickle
    </div>

    <script>
        // Background Slideshow
        const images = [
            "assets/sd-offbeat-5.jpg",
            "assets/spinozas-dog-test-10.jpg",
            "assets/sd-offbeat-9.jpg",
            "assets/spinozas-dog-test-3.jpg",
            "assets/sd-offbeat-1.jpg",
            "assets/sd-offbeat-4.jpg",
            "assets/sd-offbeat-2.jpg",
            "assets/spinozas-dog-test-9.jpg",
            "assets/spinozas-dog-test-1.jpg"
        ];
        let current = 0;
        const slideshow = document.getElementById('slideshow');
        
        function changeBg() {
            slideshow.style.backgroundImage = `url('${images[current]}')`;
            current = (current + 1) % images.length;
        }
        setInterval(changeBg, 7000);
        changeBg();
    </script>
</body>
</html>
