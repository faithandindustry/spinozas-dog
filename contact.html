<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Spinozas Dog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
   
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap');
        body {
            font-family: 'Geist', system-ui, sans-serif;
            font-weight: 400;
        }
    
        .hero-bg {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            transition: background-image 2s ease-in-out;
            background-color: #111;        /* Prevents black flash */
        }
    
        .title {
            font-size: 3.2rem;
            letter-spacing: -0.04em;
        }
        .nav-link {
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .nav-link:hover { color: #ccc; }

        .photo-credit {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            z-index: 100;
            text-align: right;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* ============== MOBILE RESPONSIVENESS ============== */
        @media (max-width: 768px) {
            .title { 
                font-size: 2.35rem; 
            }
            .nav-link { 
                font-size: 1rem; 
            }
            .max-w-lg {
                max-width: 100% !important;
            }
            .px-8, .md\\:px-12 {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }
            .text-5xl {
                font-size: 2.8rem;
            }
            .p-10 {
                padding: 1.75rem;
            }
            .text-xl, .text-2xl {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body class="bg-black text-white">

    <!-- Background Slideshow -->
    <div id="slideshow" class="hero-bg fixed inset-0 z-0"></div>

    <!-- Top Bar - Mobile Friendly -->
    <div class="relative z-50 px-6 md:px-12 py-6 md:py-8">
        <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-6 md:gap-0">
            <a href="index.html" class="title tracking-tighter text-center md:text-left">Spinozas Dog</a>
           
            <div class="flex flex-wrap justify-center gap-x-5 md:gap-x-8">
                <a href="index.html" class="nav-link">About</a>
                <a href="performances.html" class="nav-link">Performances</a>
                <a href="recordings.html" class="nav-link">Recordings</a>
                <a href="bookings.html" class="nav-link">Bookings</a>
                <a href="contact.html" class="nav-link">Network</a>
            </div>
        </div>
    </div>

    <div class="relative z-10 flex items-center justify-center min-h-[calc(100vh-120px)] px-6">
        <div class="max-w-lg text-center">
            <h1 class="text-5xl tracking-tighter mb-12">Contact</h1>
       
            <!-- Email + Instagram on same line -->
            <div class="flex justify-center items-center gap-x-8 text-xl mb-16">
                <a href="mailto:faithandindustry@protonmail.com" class="hover:underline">Email</a>
                <span class="text-white/30">|</span>
                <a href="https://www.instagram.com/spinozas_dog/" class="hover:underline">Instagram</a>
            </div>

            <!-- Mailing List Signup -->
            <div class="bg-white/5 border border-white/10 rounded-3xl p-10 mb-16">
                <h2 class="text-2xl tracking-tighter mb-6">Join our mailing list</h2>
                <form action="https://formspree.io/f/xeedabkd" method="POST" class="space-y-6">
                    <input type="email"
                           name="email"
                           placeholder="your@email.com"
                           required
                           class="w-full bg-transparent border border-white/30 rounded-2xl px-6 py-4 text-white placeholder:text-white/40 focus:outline-none focus:border-white/60">
                 
                    <button type="submit"
                            class="w-full bg-white text-black font-medium py-4 rounded-2xl hover:bg-white/90 transition">
                        Subscribe
                    </button>
                </form>
            </div>

            <!-- Network / Associates Section -->
            <div class="border-t border-white/20 pt-12">
                <h2 class="text-5xl tracking-tighter mb-8">Network</h2>
             
                <div class="grid grid-cols-1 gap-y-7 text-lg">
                    <a href="https://hereonin.org/" class="hover:underline">Hereonin — Peter Sant</a>
                    <a href="https://www.instagram.com/studioxmalta/" class="hover:underline">Studio X — Mark Axiak</a>
                    <a href="https://capitolk.com/" class="hover:underline">Capitol K — Kristian Craig</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Photo Credit -->
    <div class="photo-credit">
        Photography by Mich J Tickle
    </div>

    <script>
        // Background Slideshow - Improved (Preload to reduce black flash)
        const images = [
            "assets/sd-offbeat-5.jpg",
            "assets/spinozas-dog-test-10.jpg",
            "assets/sd-offbeat-9.jpg",
            "assets/spinozas-dog-test-3.jpg",
            "assets/sd-offbeat-1.jpg",
            "assets/sd-offbeat-4.jpg",
            "assets/sd-offbeat-2.jpg",
            "assets/spinozas-dog-test-9.jpg",
            "assets/spinozas-dog-test-1.jpg"
        ];

        let current = 0;
        const slideshow = document.getElementById('slideshow');

        // Preload images
        function preloadImages() {
            images.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }

        function changeBg() {
            slideshow.style.backgroundImage = `url('${images[current]}')`;
            current = (current + 1) % images.length;
        }

        preloadImages();
        changeBg();                    // Show first image immediately
        setInterval(changeBg, 7000);   // Change every 7 seconds
    </script>
</body>
</html>
