<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordings — Spinozas Dog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
   
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap');
        body {
            font-family: 'Geist', system-ui, sans-serif;
            font-weight: 400;
        }
    
        .hero-bg {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            transition: background-image 2s ease-in-out;
            background-color: #111;        /* Prevents black flash between images */
        }
    
        .title {
            font-size: 3.2rem;
            letter-spacing: -0.04em;
        }
        .nav-link {
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .nav-link:hover { color: #ccc; }

        .photo-credit {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            z-index: 100;
            text-align: right;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* ============== MOBILE RESPONSIVENESS ============== */
        @media (max-width: 768px) {
            .title { 
                font-size: 2.35rem; 
            }
            .nav-link { 
                font-size: 1rem; 
            }
            .max-w-xl {
                max-width: 100% !important;
            }
            .px-8, .md\\:px-12 {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }
            .text-5xl {
                font-size: 2.8rem;
            }
            .p-8 {
                padding: 1.75rem;
            }
        }
    </style>
</head>
<body class="bg-black text-white">

    <!-- Background Slideshow -->
    <div id="slideshow" class="hero-bg fixed inset-0 z-0"></div>

    <!-- Top Bar - Mobile Friendly -->
    <div class="relative z-50 px-6 md:px-12 py-6 md:py-8">
        <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-6 md:gap-0">
            <a href="index.html" class="title tracking-tighter text-center md:text-left">Spinozas Dog</a>
           
            <div class="flex flex-wrap justify-center gap-x-5 md:gap-x-8">
                <a href="index.html" class="nav-link">About</a>
                <a href="performances.html" class="nav-link">Performances</a>
                <a href="recordings.html" class="nav-link">Recordings</a>
                <a href="bookings.html" class="nav-link">Bookings</a>
                <a href="contact.html" class="nav-link">Network</a>
            </div>
        </div>
    </div>

    <div class="relative z-10 flex items-center justify-center min-h-[calc(100vh-120px)] px-6">
        <div class="max-w-xl">
            <h1 class="text-5xl tracking-tighter mb-12">Recordings</h1>
         
            <div class="space-y-12">
                <div>
                    <p class="text-2xl mb-1">Impovisation</p>
                    <p class="text-white/60">Demo • 2026</p>
                </div>
                <!-- Simple Player -->
                <div class="bg-black/70 border border-white/20 rounded-3xl p-8">
                    <button onclick="togglePlay()" id="playBtn"
                            class="w-16 h-16 mx-auto mb-6 rounded-full bg-white text-black text-4xl flex items-center justify-center hover:scale-105 transition">
                        ▶
                    </button>
                    <audio id="player" loop>
                        <source src="assets/track.mp3" type="audio/mpeg">
                    </audio>
                    <p class="text-center text-sm">Demo</p>
                </div>
                <p class="text-white/70 text-center">Spinozas Dog multitrack record all rehearsals and live performances.
Currently collating material towards a debut release.</p>
            </div>
        </div>
    </div>
  
    <!-- Photo Credit -->
    <div class="photo-credit">
        Photography by Mich J Tickle
    </div>

    <script>
        // Background Slideshow - Improved (Preload to reduce black flash)
        const images = [
            "assets/sd-offbeat-5.jpg",
            "assets/spinozas-dog-test-10.jpg",
            "assets/sd-offbeat-9.jpg",
            "assets/spinozas-dog-test-3.jpg",
            "assets/sd-offbeat-1.jpg",
            "assets/sd-offbeat-4.jpg",
            "assets/sd-offbeat-2.jpg",
            "assets/spinozas-dog-test-9.jpg",
            "assets/spinozas-dog-test-1.jpg"
        ];

        let current = 0;
        const slideshow = document.getElementById('slideshow');

        // Preload images to reduce flashing
        function preloadImages() {
            images.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }

        function changeBg() {
            slideshow.style.backgroundImage = `url('${images[current]}')`;
            current = (current + 1) % images.length;
        }

        preloadImages();
        changeBg();                    // Show first image immediately
        setInterval(changeBg, 7000);   // Change every 7 seconds

        // Player
        const audio = document.getElementById('player');
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                document.getElementById('playBtn').textContent = '❚❚';
            } else {
                audio.pause();
                document.getElementById('playBtn').textContent = '▶';
            }
        }
    </script>
</body>
</html>
